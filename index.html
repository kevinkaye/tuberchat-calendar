": "2026-12-17T21:00:00+00:00", "status": "upcoming", "kind": "Live stream", "duration": 0, "url": "https://www.youtube.com/watch?v=qa2XkEb_iVk", "thumb": "https://i.ytimg.com/vi/qa2XkEb_iVk/mqdefault.jpg", "channelName": "Two Old Guys Vintage and Resale", "tier": "Bronze", "avatar": "https://yt3.ggpht.com/wsParXevQET8YPVl8VF9qvIYcB_E3AQzHdjtEN3Ygw6km6tO12uGiOFkF8WtGBzDt8XOlM9wCA=s88-c-k-c0x00ffffff-no-rj", "order": 65}, {"id": "L4Ps9xUHWyY", "title": "🎅🍪 HO HO HOLY CHOCOLATE CHIPS! 🎄 The SECRET to Diabetic-Friendly Christmas Cookies! | LIVE", "start": "2026-12-20T22:00:00+00:00", "end": "2026-12-20T23:00:00+00:00", "status": "upcoming", "kind": "Live stream", "duration": 0, "url": "https://www.youtube.com/watch?v=L4Ps9xUHWyY", "thumb": "https://i.ytimg.com/vi/L4Ps9xUHWyY/mqdefault.jpg", "channelName": "Cooking with The Munchie Mafia Official", "tier": "Bronze", "avatar": "https://yt3.ggpht.com/Z0JvPKjxOhkEey8nvA3SfphabaPaD0e_-3BTPkHAdn76iI8d-_rgA9krIbZ233oQfIzdO4dmjw=s88-c-k-c0x00ffffff-no-rj", "order": 75}, {"id": "DrpRXw8x36c", "title": "🎄 A Sew Very Merry Christmas LIVE! 🎅 Quilting, LEGO & Christmas Fun in Greenland! ❄️ EP44-26", "start": "2026-12-25T21:30:00+00:00", "end": "2026-12-25T22:30:00+00:00", "status": "upcoming", "kind": "Live stream", "duration": 0, "url": "https://www.youtube.com/watch?v=DrpRXw8x36c", "thumb": "https://i.ytimg.com/vi/DrpRXw8x36c/mqdefault.jpg", "channelName": "Greenland Quilter (Katy)", "tier": "Bronze", "avatar": "https://yt3.ggpht.com/IJgdCnSvBubTxjm7U0oZS0o7DI9NX1MM1XXRbc4vIknIWxUooUdrZdsTrpjjddA6FKuiw42HeYc=s88-c-k-c0x00ffffff-no-rj", "order": 67}], "tierOrder": ["Gold", "Silver", "Bronze"]};
const tiers = DATA.tierOrder;
const active = new Set(tiers);
const TZ = "America/Toronto";   // all times are Eastern
const fmtDay = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric", timeZone: TZ });
const fmtTime = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit", timeZone: TZ });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const visible = e => active.has(e.tier) || (!tiers.includes(e.tier) && active.size === tiers.length);
// Timeline order. Only when start times are identical: e.order, which the generator sets from
// level (Gold, Silver, Bronze), most total months as member, earliest original membership date, then name.
const byTimeline = (a, b) => a.start.localeCompare(b.start) || a.order - b.order;
const byNewest = (a, b) => b.start.localeCompare(a.start) || a.order - b.order;
const av = e => `<img class="av" loading="lazy" src="${esc(e.avatar || "")}" alt="">`;

document.getElementById("updated").textContent =
  `${DATA.memberCount} channels · updated ${new Date(DATA.generatedAt).toLocaleString(undefined, { timeZone: TZ, dateStyle: "medium", timeStyle: "short" })} ET · times shown in Eastern Time`;

// Theme toggle: auto (system) → light → dark
const themeBtn = document.getElementById("themeBtn");
const themeLabel = { auto: "◐ Auto", light: "☀ Light", dark: "☾ Dark" };
let theme = document.documentElement.dataset.theme || "auto";
function applyTheme() {
  if (theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
  try { theme === "auto" ? localStorage.removeItem("tc-theme") : localStorage.setItem("tc-theme", theme); } catch (e) {}
  themeBtn.textContent = themeLabel[theme];
}
themeBtn.onclick = () => { theme = { auto: "light", light: "dark", dark: "auto" }[theme]; applyTheme(); };

// Tier filter chips
const chips = document.getElementById("tierChips");
tiers.forEach(t => {
  const b = document.createElement("button");
  b.className = `chip ${t}`; b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<span class="dot"></span>${t}`;
  b.onclick = () => { active.has(t) ? active.delete(t) : active.add(t); b.setAttribute("aria-pressed", active.has(t)); render(); };
  chips.appendChild(b);
});

// Duration as H:MM:SS or M:SS, like YouTube
const fmtDur = sec => { sec = Math.round(sec); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
function evRow(e) {
  const label = (e.status === "live" ? `<span class="badge live-badge">Live</span> ` : "") + `<span>${esc(e.kind)}</span>`
    + (e.duration && (e.status === "ended" || e.status === "video") ? ` · <span class="dur">${fmtDur(e.duration)}</span>` : "");
  return `<a class="ev ${esc(e.tier)} ${e.status}" href="${esc(e.url)}" target="_blank" rel="noopener">
    <div class="time">${fmtTime.format(new Date(e.start))}</div>
    <img class="thumb" loading="lazy" src="${esc(e.thumb || "")}" alt="">
    <div class="body">${av(e)}<div><div class="t">${esc(e.title)}</div>
      <div class="meta"><span>${esc(e.channelName)}</span>·${label}</div></div></div>
  </a>`;
}

// Every list: grouped by day (Eastern), 20 rows at a time with "Show more".
const shown = {};
function renderList(id, btnId, list, emptyText, groupByDay = true) {
  shown[id] = shown[id] || 20;
  const days = new Map();
  list.slice(0, shown[id]).forEach(e => {
    const k = fmtDay.format(new Date(e.start));
    if (!days.has(k)) days.set(k, []);
    days.get(k).push(e);
  });
  document.getElementById(id).innerHTML = groupByDay
    ? [...days].map(([k, items]) => `<div class="day"><div class="day-h">${k}</div>${items.map(evRow).join("")}</div>`).join("") || (emptyText ? `<div class="empty">${emptyText}</div>` : "")
    : list.slice(0, shown[id]).map(evRow).join("") || (emptyText ? `<div class="empty">${emptyText}</div>` : "");
  const btn = document.getElementById(btnId);
  btn.hidden = list.length <= shown[id];
  btn.onclick = () => { shown[id] += 20; render(); };
  return list.length;
}

function render() {
  const now = Date.now();
  const live = DATA.events.filter(e => e.status === "live" && visible(e)).sort(byTimeline);
  renderList("live", "moreLiveNow", live, "Nobody's live right now. Check Upcoming for what's next.", false);
  document.getElementById("liveLabel").textContent = live.length ? `Live now · ${live.length}` : "Live now";
  document.getElementById("liveDot").classList.toggle("on", live.length > 0);
  // Hide "upcoming" placeholders more than 15 minutes past their start time.
  renderList("agenda", "moreAgenda", DATA.events.filter(e => e.status === "upcoming" && visible(e)
    && Date.parse(e.start) >= now - 15 * 60e3).sort(byTimeline), "Nothing scheduled yet.");
  renderList("recentLive", "moreLive", DATA.events.filter(e => e.status === "ended" && visible(e)).sort(byNewest), "Nothing in the last week.");
  renderList("recentVideos", "moreVideos", DATA.events.filter(e => e.status === "video" && visible(e)).sort(byNewest), "Nothing in the last week.");
}

document.querySelectorAll(".chip.view").forEach(b => b.onclick = () => {
  document.querySelectorAll(".chip.view").forEach(x => x.setAttribute("aria-pressed", x === b));
  ["live", "upcoming", "streams", "videos"].forEach(t => document.getElementById("tab-" + t).hidden = t !== b.dataset.tab);
});
applyTheme();
render();
</script>
